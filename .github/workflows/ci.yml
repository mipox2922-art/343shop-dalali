name: 343SHOP CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/mr-ai-store-operations-api"]

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run check
      - run: npm test
